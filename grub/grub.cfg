# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Load graphics modules
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png

# Step 1: Load a font from the memdisk (embedded in the standalone binary).
# This always works regardless of $root and guarantees gfxterm can initialize.
if loadfont "${prefix}/fonts/unicode.pf2"; then
    set gfxmode="1920x1080,1280x1024,1024x768,auto"
    terminal_input console
    terminal_output gfxterm
fi

# Step 2: Search for the ISO volume and set $root.
# The embedded config exports ARCHISO_UUID and ARCHISO_HINT but NOT $root,
# so $root is unset after configfile creates a new environment context.
if [ -n "${ARCHISO_UUID}" ]; then
    search --no-floppy --set=root --fs-uuid "${ARCHISO_UUID}"
else
    search --no-floppy --set=root --file '%ARCHISO_SEARCH_FILENAME%'
fi

# Step 3: Load custom theme fonts from the ISO filesystem (now that $root is set).
# These override the unicode.pf2 fallback for better-looking text.
loadfont /boot/grub/themes/linexin/font_16.pf2
loadfont /boot/grub/themes/linexin/font_24.pf2
loadfont /boot/grub/themes/linexin/font_28_bold.pf2

# Step 4: Set theme. GRUB parses theme.txt and loads its assets when rendering the menu.
set theme="/boot/grub/themes/linexin/theme.txt"
export theme

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
    if [ "${grub_cpu}" == 'x86_64' ]; then
        archiso_platform="x64 ${archiso_platform}"
    elif [ "${grub_cpu}" == 'i386' ]; then
        archiso_platform="IA32 ${archiso_platform}"
    else
        archiso_platform="${grub_cpu} ${archiso_platform}"
    fi
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu} ${grub_platform}"
fi

# Set default menu entry
default=linexin-nvidia
timeout=15
timeout_style=menu


# Menu entries

menuentry "Install Linexin (NVIDIA GPU - newer than Pascal series ONLY)" --class nvidia --class gnu-linux --class gnu --class os --id 'linexin-nvidia' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Install Linexin (AMD / old NVIDIA GPU)" --class amd --class gnu-linux --class gnu --class os --id 'linexin-amd' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% modprobe.blacklist=nvidia,nvidia-drm,nvidia-modeset nouveau.modeset=1 quiet splash
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}


if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" == "i386" -a -f '/shellia32.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellia32.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --class uefi-firmware --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class restart --class reboot {
    echo 'System rebooting...'
    reboot
}
